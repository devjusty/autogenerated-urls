name: Release plugin

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release ZIP
    runs-on: ubuntu-latest

    steps:
      - name: Check out release tag
        uses: actions/checkout@v6

      - name: Verify tag and plugin versions match
        id: version
        shell: bash
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          plugin_version="$(sed -n 's/^[[:space:]]*\*[[:space:]]*Version:[[:space:]]*//p' autogenerated-urls.php | tr -d '\r' | xargs)"

          if [[ -z "${version}" || "${version}" == "${tag}" ]]; then
            echo "Release tags must use the v-prefixed format, such as v1.2.1." >&2
            exit 1
          fi

          if [[ "${version}" != "${plugin_version}" ]]; then
            echo "Tag ${tag} does not match plugin Version: ${plugin_version}." >&2
            exit 1
          fi

          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "archive=autogenerated-urls-${version}.zip" >> "${GITHUB_OUTPUT}"

      - name: Validate plugin PHP
        run: php -l autogenerated-urls.php

      - name: Build production archive
        shell: bash
        run: |
          set -euo pipefail

          archive="${RUNNER_TEMP}/${{ steps.version.outputs.archive }}"
          git archive \
            --format=zip \
            --prefix=autogenerated-urls/ \
            --output="${archive}" \
            "${GITHUB_SHA}"

          unzip -t "${archive}"
          unzip -Z1 "${archive}" > "${RUNNER_TEMP}/archive-files.txt"

          if ! grep -qx 'autogenerated-urls/autogenerated-urls.php' "${RUNNER_TEMP}/archive-files.txt"; then
            echo "The archive does not contain the plugin entry file." >&2
            exit 1
          fi

          if ! grep -qx 'autogenerated-urls/LICENSE.txt' "${RUNNER_TEMP}/archive-files.txt"; then
            echo "The archive does not contain the GPL license text." >&2
            exit 1
          fi

          if grep -Eq '^autogenerated-urls/(\.agents|\.github|\.vscode|tests|vendor)/' "${RUNNER_TEMP}/archive-files.txt"; then
            echo "The archive contains development-only directories." >&2
            exit 1
          fi

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE: ${{ runner.temp }}/${{ steps.version.outputs.archive }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "${ARCHIVE}" --clobber
          else
            gh release create "${TAG}" "${ARCHIVE}" \
              --verify-tag \
              --title "Display Auto-Generated URLs ${VERSION}" \
              --generate-notes
          fi
